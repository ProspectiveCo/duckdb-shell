<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Perspective + DuckDB</title>
        <script type="module" src="index.js"></script>
        <link rel="stylesheet" href="index.css" />
        <style>
            #query {
                overflow: hidden;
            }

            #shell-container {
                background-color: #282a36;
                overflow: hidden;
                position: relative;
                padding:24px;
            }

            #version {
                position: absolute;
                top: 12px;
                right: 12px;
                z-index: 100;
                color: white;
                font-family: monospace;
                background-color: rgba(40, 42, 54, 0.8);
                padding: 12px;
            }

            perspective-workspace {
                background-color: #282a36;
                overflow: hidden;
            }

            regular-layout {
                background-color: #000;
                gap: 4px;
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                overflow: hidden;
            }
            body {
                overflow:hidden;
            }
        </style>
    </head>
    <body>
         <regular-layout id="layout">
            <div id="shell-container" name="sql">
                <span id="version">4.2.0-nightly-6161af</span>
            </div>
            <perspective-workspace id="query" name="query"></perspective-workspace>
        </regular-layout>
    </body>
</html>
